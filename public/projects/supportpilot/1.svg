ont-size="13.5" font-weight="700" fill="#f1f1f8" text-anchor="start" opacity="1">Elena S.</text><text x="526" y="402" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#8a8aa8" text-anchor="end" opacity="1">21m</text><text x="318" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#8a8aa8" text-anchor="start" opacity="1">Do you support SSO?</text><circle cx="290" cy="494" r="16" fill="#f43f5e"/><text x="290" y="498" font-family="Arial, Helvetica, sans-serif" font-size="14.4" font-weight="700" fill="#fff" text-anchor="middle" opacity="1">O</text><text x="318" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#f1f1f8" text-anchor="start" opacity="1">Omar H.</text><text x="526" y="492" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#8a8aa8" text-anchor="end" opacity="1">1h</text><text x="318" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#8a8aa8" text-anchor="start" opacity="1">Invoice for March missing</text><circle cx="290" cy="584" r="16" fill="#0ea5e9"/><text x="290" y="588" font-family="Arial, Helvetica, sans-serif" font-size="14.4" font-weight="700" fill="#fff" text-anchor="middle" opacity="1">G</text><text x="318" y="582" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#f1f1f8" text-anchor="start" opacity="1">Grace L.</text><text x="526" y="582" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#8a8aa8" text-anchor="end" opacity="1">2h</text><text x="318" y="604" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#8a8aa8" text-anchor="start" opacity="1">Export data as CSV?</text><rect x="568" y="142" width="660" height="600" rx="14" fill="#14142a" opacity="1"/><text x="592" y="176" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f1f1f8" text-anchor="start" opacity="1">Dana K.</text><rect x="666" y="160" width="89.1" height="24" rx="12" fill="#34d399" opacity="0.18"/><text x="677" y="176" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#34d399" text-anchor="start" opacity="1">AI handling</text><g data-w="89.1"/><line x1="568" y1="196" x2="1228" y2="196" stroke="#26263f"/><rect x="592" y="216" width="400" height="56" rx="14" fill="#1b1b36" opacity="1"/><text x="612" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#f1f1f8" text-anchor="start" opacity="1">Hi! I forgot my password and the reset</text><text x="612" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#f1f1f8" text-anchor="start" opacity="1">email never arrives. How do I reset it?</text><rect x="740" y="292" width="464" height="150" rx="14" fill="url(#g51)" opacity="1"/><text x="760" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">Sorry about that, Dana! Reset emails can take up to</text><text x="760" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">5 minutes and sometimes land in spam. If it still</text><text x="760" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">hasn't arrived, go to Settings → Security → Reset</text><text x="760" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">password and I'll send a new link right away.</text><rect x="760" y="402" width="190" height="24" rx="12" fill="#fff" opacity="0.22"/><text x="773" y="418" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="600" fill="#fff" text-anchor="start" opacity="1">📄 Help: Account recovery</text><rect x="592" y="462" width="330" height="40" rx="14" fill="#1b1b36" opacity="1"/><text x="612" y="487" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#f1f1f8" text-anchor="start" opacity="1">That worked, thank you!</text><rect x="740" y="522" width="330" height="40" rx="14" fill="url(#g51)" opacity="1"/><text x="760" y="547" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#fff" text-anchor="start" opacity="1">Glad to help! Anything else?</text><rect x="592" y="680" width="560" height="44" rx="22" fill="#1b1b36" stroke="#26263f" opacity="1"/><text x="616" y="707" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#5a5a7a" text-anchor="start" opacity="1">Type a reply or take over the chat…</text><rect x="1164" y="680" width="44" height="44" rx="22" fill="url(#g51)" opacity="1"/>
